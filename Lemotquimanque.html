<meta charset="utf-8">
<title>Leçon 2 — Le mot qui manque</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --navy:#14213D; --gold:#C9A961; --gold2:#E3C782;
  --ink:#F4F1EA; --dim:#9BA6BC; --green:#4ECDA4; --red:#FF6B6B; --plum:#B98CD8;
}
html,body{height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,#1E3157 0%,var(--navy) 55%,#0D1729 100%);
  color:var(--ink); font-family:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;
  overflow:hidden;
}
#stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:66px 52px 92px}
.screen{display:none;width:100%;max-width:1180px;text-align:center}
.screen.on{display:block;animation:in .5s cubic-bezier(.2,.8,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.kicker{font-size:19px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;font-weight:700}
.tag{font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum);font-weight:700;margin-bottom:16px}
h1{font-size:72px;line-height:1.06;font-weight:800;letter-spacing:-.02em}
h2{font-size:54px;line-height:1.1;font-weight:800;letter-spacing:-.015em}
.sub{font-size:29px;color:var(--dim);margin-top:20px;line-height:1.45}
.en{font-size:22px;color:#7F8CA6;font-style:italic;margin-top:14px}
.gold{color:var(--gold2)}

#logo{position:fixed;top:20px;left:26px;height:44px;opacity:.92;z-index:9}
#nav{position:fixed;bottom:18px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px;z-index:9}
.dot{width:9px;height:9px;border-radius:50%;background:#3A4B6E;transition:.3s;cursor:pointer}
.dot.on{background:var(--gold);transform:scale(1.5)}
#hint{position:fixed;bottom:48px;left:0;right:0;text-align:center;font-size:14px;color:#5E6C88;letter-spacing:.1em}

.btn{display:inline-block;margin:11px 8px;padding:18px 36px;border-radius:15px;border:2px solid var(--gold);
  background:transparent;color:var(--gold2);font-size:24px;font-weight:700;cursor:pointer;transition:.22s;font-family:inherit}
.btn:hover{background:var(--gold);color:var(--navy);transform:translateY(-3px)}
.btn.solid{background:var(--gold);color:var(--navy)}
.btn.solid:hover{background:var(--gold2)}

.timer{font-size:120px;font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.timer.run{color:var(--green)}
.timer.warn{color:var(--gold2)}
.timer.end{color:var(--red);animation:shake .5s}
.timer.wait{color:#5E6C88}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.ring{width:100%;height:11px;background:#22345A;border-radius:99px;overflow:hidden;margin:28px auto 0;max-width:720px}
.ring i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--gold));width:100%;transition:width .25s linear}

.grid{display:grid;gap:18px;margin-top:32px}
.g2{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:rgba(255,255,255,.05);border:2px solid rgba(201,169,97,.28);border-radius:20px;
  padding:30px 20px;cursor:pointer;transition:.28s;min-height:142px;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.card:hover{border-color:var(--gold);transform:translateY(-5px)}
.card .fr{font-size:36px;font-weight:800;color:var(--gold2);line-height:1.15}
.card .tr{font-size:19px;color:var(--dim);margin-top:13px;opacity:0;transition:.35s;font-style:italic}
.card.open{background:rgba(201,169,97,.16);border-color:var(--gold)}
.card.open .tr{opacity:1}
.card.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}

.rule{background:rgba(255,107,107,.1);border:2px solid rgba(255,107,107,.45);border-radius:18px;
  padding:22px 30px;margin-top:20px;font-size:27px;text-align:left;line-height:1.4}
.rule b{color:var(--red)}
.ok{background:rgba(78,205,164,.1);border-color:rgba(78,205,164,.45)}
.ok b{color:var(--green)}

.pill{display:inline-block;padding:11px 24px;border-radius:99px;background:rgba(201,169,97,.16);
  border:2px solid rgba(201,169,97,.4);font-size:25px;font-weight:700;color:var(--gold2);margin:7px}

.slot{font-size:52px;font-weight:800;color:var(--gold2);min-height:96px;display:flex;align-items:center;justify-content:center;line-height:1.15}
.slot.roll{animation:roll .09s linear infinite}
@keyframes roll{0%{opacity:.35;transform:translateY(-8px)}100%{opacity:1;transform:none}}

/* images */
.imgwrap{display:flex;gap:34px;align-items:center;justify-content:center;margin-top:16px}
.imgbox{flex:0 0 auto;width:430px;height:330px;border-radius:20px;overflow:hidden;
  border:3px solid rgba(201,169,97,.45);background:#0D1729;display:flex;align-items:center;justify-content:center}
.imgbox img{width:100%;height:100%;object-fit:contain}
.steps3{flex:1;text-align:left;max-width:520px}
.st{font-size:29px;margin:16px 0;color:var(--ink);line-height:1.3}
.st b{color:var(--gold2)}
.st .n{display:inline-block;width:42px;height:42px;line-height:42px;text-align:center;border-radius:50%;
  background:rgba(201,169,97,.2);color:var(--gold2);font-weight:800;font-size:23px;margin-right:14px}
.reveal{margin-top:22px;font-size:44px;font-weight:800;color:var(--green);opacity:0;transition:.4s;min-height:58px}
.reveal.on{opacity:1}
.reveal small{display:block;font-size:20px;color:var(--dim);font-weight:400;font-style:italic;margin-top:6px}
.counter{font-size:20px;color:var(--dim);letter-spacing:.18em;margin-bottom:14px}

.into{font-size:42px;font-weight:800;line-height:1.7;color:var(--ink)}
.into span{color:var(--gold2);font-size:54px}
</style>

   +     '<div class="st"><span class="n">1</span><b>Qu\u2019est-ce que c\u2019est ?</b><br><span style="font-size:22px;color:#7F8CA6">sans dire le nom</span></div>'
   +     '<div class="st"><span class="n">2</span><b>Ça sert à quoi ?</b></div>'
   +     '<div class="st"><span class="n">3</span><b>Toi, tu en penses quoi ?</b></div>'
   +     '<div id="rev' + oi + '" class="reveal">' + OBJETS[oi].mot
   +       '<small>' + OBJETS[oi].en + '</small></div>'
   +   '</div>'
   + '</div>'
   + '<div id="to' + oi + '" class="timer" style="font-size:72px;margin-top:6px">40</div>'
   + '<div><button class="btn solid" onclick="runObj(' + oi + ')">Chrono 40 s</button>'
   + '<button class="btn" onclick="showMot(' + oi + ')">Révéler le mot</button></div>');
}

/* 11,12,13 — scènes */
for (var si = 0; si < SCENES.length; si++) {
  SCREENS.push('<div class="counter">SCÈNE ' + (si + 1) + ' / 3</div>'
   + '<h2 style="font-size:40px">' + SCENES[si].titre + '</h2>'
   + '<div class="imgwrap" style="margin-top:14px">'
   +   '<div class="imgbox" style="width:520px;height:300px"><img src="' + IMG[SCENES[si].key] + '" alt=""></div>'
   +   '<div class="steps3"><div class="st" style="font-size:31px">' + SCENES[si].q + '</div>'
   +   '<div class="en">60 seconds. Describe, then give your opinion.</div></div>'
   + '</div>'
   + '<div id="ts' + si + '" class="timer" style="font-size:72px;margin-top:6px">1:00</div>'
   + '<div><button class="btn solid" onclick="runSc(' + si + ')">Chrono 60 s</button></div>');
}

/* 14 — le français du flou */
SCREENS.push('<div class="kicker">Bloc langue</div>'
 + '<h2>Le français du <span class="gold">flou</span></h2>'
 + '<div class="sub" style="font-size:25px">Quatre formules pour parler d\u2019une chose sans la nommer.</div>'
 + '<div class="grid g4" id="flou"></div>'
 + '<div style="margin-top:24px"><button class="btn" onclick="allCards(\'flou\')">Tout révéler</button></div>');

/* 15 — mission */
SCREENS.push('<div class="kicker">Ta mission</div>'
 + '<h1>Un objet <span class="gold">par jour</span></h1>'
 + '<div class="sub">Pendant ton vélo, choisis une chose que tu vois.<br>Décris-la 30 secondes en français. Sans chercher son nom.</div>'
 + '<div style="margin-top:28px">'
 + '<span class="pill">on dirait…</span><span class="pill">ça ressemble à…</span>'
 + '<span class="pill">une sorte de…</span><span class="pill">comment dire…</span></div>'
 + '<div class="en" style="margin-top:26px">Plus your 90 seconds. Every day.</div>');

/* 16 — clôture */
SCREENS.push('<div class="kicker">Pour finir · détente</div>'
 + '<h2>Tu as déjà <span class="gold">gagné</span> quelque chose</h2>'
 + '<div class="sub" style="font-size:25px">La semaine dernière, tu as demandé <b class="gold">quatre fois</b> de répéter.<br>En français. Sans y penser.</div>'
 + '<div class="into" style="margin-top:26px">Tu peux répéter <span>?</span> &nbsp;&nbsp; C\u2019est-à-dire <span>?</span> &nbsp;&nbsp; Et toi <span>?</span></div>'
 + '<div class="en" style="margin-top:22px">Six months ago you asked in English. Now you ask in French. That is the whole game.</div>');

/* ---------- DATA CARTES ---------- */
var OUTILS = [
  ["C\u2019est un truc pour…", "it\u2019s a thing for…"],
  ["C\u2019est comme un…", "it\u2019s like a…"],
  ["Ça sert à…", "it\u2019s used to…"],
  ["C\u2019est le contraire de…", "it\u2019s the opposite of…"]
];

var FLOU = [
  ["on dirait…", "it looks like…"],
  ["ça ressemble à…", "it resembles…"],
  ["une sorte de…", "a kind of…"],
  ["comment dire…", "how do I put it…"]
];

/* ---------- BUILD ---------- */
var stage = document.getElementById("stage");
var nav = document.getElementById("nav");
for (var i = 0; i < SCREENS.length; i++) {
  var d = document.createElement("div");
  d.className = "screen";
  d.innerHTML = SCREENS[i];
  stage.appendChild(d);
  var dot = document.createElement("div");
  dot.className = "dot";
  dot.setAttribute("data-i", i);
  dot.onclick = function () { go(parseInt(this.getAttribute("data-i"), 10)); };
  nav.appendChild(dot);
}
var slides = document.querySelectorAll(".screen");
var dots = document.querySelectorAll(".dot");
var cur = 0;

function fill(boxId, arr) {
  var box = document.getElementById(boxId);
  if (!box) return;
  box.innerHTML = "";
  for (var i = 0; i < arr.length; i++) {
    var c = document.createElement("div");
    c.className = "card";
    c.innerHTML = '<div class="fr">' + arr[i][0] + '</div><div class="tr">' + arr[i][1] + '</div>';
    c.onclick = function () { this.classList.toggle("open"); this.classList.add("pop"); };
    box.appendChild(c);
  }
}
fill("outils", OUTILS);
fill("flou", FLOU);

function allCards(id) {
  var cs = document.querySelectorAll("#" + id + " .card");
  for (var i = 0; i < cs.length; i++) {
    (function (el, n) { setTimeout(function () { el.classList.add("open", "pop"); }, n * 110); })(cs[i], i);
  }
}

function go(n) {
  if (n < 0 || n >= slides.length) return;
  stopAll();
  slides[cur].classList.remove("on");
  dots[cur].classList.remove("on");
  cur = n;
  slides[cur].classList.add("on");
  dots[cur].classList.add("on");
}
go(0);

document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(cur + 1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); go(cur - 1); }
});

/* ---------- TIMERS ---------- */
var iv90 = null, ivF = null, ivT = null, toT = null, ivO = null, ivS = null;
function stopAll() {
  clearInterval(iv90); clearInterval(ivF); clearInterval(ivT);
  clearTimeout(toT); clearInterval(ivO); clearInterval(ivS);
  reset90(); resetF();
}
function fmt(s) { var m = Math.floor(s / 60); var r = s % 60; return m + ":" + (r < 10 ? "0" : "") + r; }

function countdown(elId, barId, total, done) {
  var el = document.getElementById(elId);
  var bar = barId ? document.getElementById(barId) : null;
  var t = total;
  el.className = "timer run";
  el.textContent = total >= 60 ? fmt(t) : t;
  if (bar) bar.style.width = "100%";
  return setInterval(function () {
    t--;
    el.textContent = total >= 60 ? fmt(t < 0 ? 0 : t) : (t > 0 ? t : 0);
    if (bar) bar.style.width = (t / total * 100) + "%";
    if (t <= Math.max(5, total * 0.17) && t > 0) el.className = "timer warn";
    if (t <= 0) { el.className = "timer end"; el.textContent = "STOP"; if (done) done(); }
  }, 1000);
}

function run90() { clearInterval(iv90); iv90 = countdown("t90", "b90", 90, function () { clearInterval(iv90); }); }
function reset90() {
  var el = document.getElementById("t90"), bar = document.getElementById("b90");
  if (el) { el.className = "timer"; el.textContent = "1:30"; bar.style.width = "100%"; }
}
function stop90() { clearInterval(iv90); reset90(); }

function runF() { clearInterval(ivF); ivF = countdown("tF", "bF", 90, function () { clearInterval(ivF); }); }
function resetF() {
  var el = document.getElementById("tF"), bar = document.getElementById("bF");
  if (el) { el.className = "timer"; el.textContent = "1:30"; bar.style.width = "100%"; }
}
function stopF() { clearInterval(ivF); resetF(); }

function spin(elId, arr, done) {
  var el = document.getElementById(elId);
  if (!el) return;
  el.classList.add("roll");
  var n = 0;
  var s = setInterval(function () {
    el.textContent = arr[Math.floor(Math.random() * arr.length)];
    n++;
    if (n > 12) { clearInterval(s); el.classList.remove("roll"); if (done) done(); }
  }, 70);
}
function spinF() { spin("slotF", FROIDS); }

/* mot interdit : 3 s de lecture puis 45 s */
function spinT() {
  clearInterval(ivT); clearTimeout(toT);
  var el = document.getElementById("tT");
  el.className = "timer wait"; el.textContent = "…";
  spin("slotT", TABOU, function () {
    el.className = "timer wait"; el.textContent = "prêt…";
    toT = setTimeout(function () {
      ivT = countdown("tT", null, 45, function () { clearInterval(ivT); });
    }, 3000);
  });
}

function runObj(i) {
  clearInterval(ivO);
  document.getElementById("rev" + i).classList.remove("on");
  ivO = countdown("to" + i, null, 40, function () { clearInterval(ivO); });
}
function showMot(i) { document.getElementById("rev" + i).classList.add("on"); }

function runSc(i) { clearInterval(ivS); ivS = countdown("ts" + i, null, 60, function () { clearInterval(ivS); }); }
</script>
